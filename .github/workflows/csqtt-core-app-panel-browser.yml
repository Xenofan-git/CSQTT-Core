name: CSQTT Core seven-tab app browser acceptance

on:
  push:
    branches:
      - fix/direct-dnsmasq-dualstack-production
    paths:
      - adapt/csqtt-panel-preview.html
      - adapt/test-csqtt-panel-browser.py
      - adapt/test-csqtt-panel-contract.py
      - adapt/test-csqtt-panel-api-method-contract.py
      - adapt/test-csqtt-core-branding.py
      - adapt/package-csqtt-core-web.py
      - adapt/test-csqtt-core-web-package.py
      - adapt/test-csqtt-core-no-dart-patching.py
      - adapt/test-csqtt-core-go-api-boundary.py
      - adapt/CSQTT-CORE-TEST-EVIDENCE-2026-11-21.md
      - adapt/csqtt_core_deploy_bridge_linux.go
      - adapt/csqtt_core_deploy_bridge_test.go
      - adapt/csqtt_core_deploy_request_linux.go
      - adapt/csqtt_core_deploy_request_test.go
      - adapt/apply-pinned-original-linux-arm64-policy.py
      - adapt/nanopi.js
      - captcha-bridge/manifest.json
      - captcha-bridge/options.html
      - captcha-bridge/README.md
      - adapt/headless_main.go
      - .github/workflows/csqtt-core-app-panel-browser.yml
  pull_request:
    paths:
      - adapt/csqtt-panel-preview.html
      - adapt/test-csqtt-panel-browser.py
      - adapt/test-csqtt-panel-contract.py
      - adapt/test-csqtt-panel-api-method-contract.py
      - adapt/test-csqtt-core-branding.py
      - adapt/package-csqtt-core-web.py
      - adapt/test-csqtt-core-web-package.py
      - adapt/test-csqtt-core-no-dart-patching.py
      - adapt/test-csqtt-core-go-api-boundary.py
      - adapt/CSQTT-CORE-TEST-EVIDENCE-2026-11-21.md
      - adapt/csqtt_core_deploy_bridge_linux.go
      - adapt/csqtt_core_deploy_bridge_test.go
      - adapt/csqtt_core_deploy_request_linux.go
      - adapt/csqtt_core_deploy_request_test.go
      - adapt/apply-pinned-original-linux-arm64-policy.py
      - adapt/nanopi.js
      - captcha-bridge/manifest.json
      - captcha-bridge/options.html
      - captcha-bridge/README.md
      - adapt/headless_main.go
      - .github/workflows/csqtt-core-app-panel-browser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seven-tab-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CSQTT Core test-evidence ledger and selective impact rules
        run: |
          python3 - <<'PY'
          from fnmatch import fnmatchcase
          import json
          from pathlib import Path
          import re
          import subprocess

          ledger = Path("adapt/CSQTT-CORE-TEST-EVIDENCE-2026-11-21.md").read_text()
          marker = chr(96)*3
          parts = ledger.split(marker+"json\n")
          assert len(parts)==2, "exactly one test-evidence JSON block required"
          data = json.loads(parts[1].split("\n"+marker,1)[0])
          assert data["project"]=="CSQTT Core" and data["schema_version"]==1
          assert data["policy"] and len(data["evidence"]) >= 7
          assert len(data["impact_rules"])>=10
          ids = set()
          counts = {"passed":0,"historical":0,"pending":0}
          for record in data["evidence"]:
              assert record["id"] not in ids
              ids.add(record["id"])
              status = record["status"]
              assert status in counts
              counts[status]+=1
              assert record["scope"] and record["component"]
              assert re.fullmatch(r"[a-f0-9]{40}|unverified",record["commit"])
              if status in ("passed","historical"):
                  assert re.fullmatch(r"[a-f0-9]{40}",record["commit"])
                  assert isinstance(record["run_id"],int) and record["run_id"]>0
              if record["run_id"] is not None:
                  assert record["url"]=="https://github.com/Xenofan-git/CSQTT-Core/actions/runs/"+str(record["run_id"])
              else:
                  assert record["url"] is None and status=="pending"
          assert counts["passed"]>=3 and counts["pending"]>=2

          def impact(paths):
              suites=set()
              unknown=[]
              for path in set(paths):
                  matched=False
                  for group in data["impact_rules"]:
                      if any(fnmatchcase(path,p) for p in group["paths"]):
                          matched=True
                          suites.update(group["tests"])
                  if not matched:
                      unknown.append(path)
              if unknown:
                  suites.add("manual-impact-review")
              return sorted(suites),sorted(unknown)

          fixtures={
              "README.md":[],
              "adapt/CSQTT-CORE-TEST-EVIDENCE-2026-11-21.md":["ledger-validation"],
              "adapt/csqtt-panel-preview.html":["go-arm64-integrated","seven-tab-browser"],
              "adapt/csqtt_core_deploy_request_linux.go":["deploy-fixture","go-arm64-integrated","go-unit-race"],
              "adapt/apply-pinned-original-linux-arm64-policy.py":["go-arm64-integrated","go-unit-race","isolated-routing-vm"],
              "server-assets/deploy-csqtt-core-250.sh":["deploy-regression","isolated-upgrade-rollback-if-new-binary"],
              "adapt/derive-csqtt-core-rust-250.py":["isolated-runtime-vm","rust-arm64-binary"],
              "adapt/test-csqtt-core-go-api-boundary.py":["seven-tab-browser"],
              ".github/workflows/build-original-linux-arm64.yml":["go-arm64-integrated"],
              "unknown/path/new-executable.go":["manual-impact-review"],
          }
          for path, expected in fixtures.items():
              actual,_=impact([path])
              assert actual==expected, f"impact classifier failed for {path}: {actual}"
          # Evidence-only changes must not start integrated ARM64 CI.
          heavy = Path(".github/workflows/build-original-linux-arm64.yml").read_text()
          assert "      - adapt/*.md" in heavy
          assert "      - README.md" in heavy
          assert "      - .github/workflows/csqtt-core-app-panel-browser.yml" in heavy
          print("PASS evidence ledger: verified record schemas", counts)
          print("PASS selective impact classifier: 10 isolated fixtures; unknown => manual review")

          diff=subprocess.run(["git","diff","--name-only","-z","HEAD^","HEAD"],
                              check=True,capture_output=True)
          changed=[x.decode() for x in diff.stdout.split(bytes([0])) if x]
          selected,unknown=impact(changed)
          print("CHANGED",json.dumps(changed,ensure_ascii=False))
          print("RECOMMENDED TEST CATEGORIES",json.dumps(selected,ensure_ascii=False))
          if unknown:
              print("REQUIRES HUMAN REVIEW (NOT AUTOMATICALLY COVERED)",json.dumps(unknown,ensure_ascii=False))
          print("NOTE: this classification is advisory; no old success proves a later changed binary.")
          PY
      - name: Validate seven tabs, route existence and actual Go API verbs
        run: |
          python adapt/test-csqtt-panel-contract.py
          python adapt/test-csqtt-panel-api-method-contract.py
          python adapt/test-csqtt-core-branding.py
          python adapt/test-csqtt-core-web-package.py
          python adapt/test-csqtt-core-no-dart-patching.py
          python adapt/test-csqtt-core-go-api-boundary.py
      - name: Prepare isolated Chromium/Playwright browser test
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CSQTT_TEST_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CSQTT_TEST_CHROMIUM=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Run seven-tab Desktop/Mobile mock API browser acceptance
        run: |
          python adapt/test-csqtt-panel-browser.py
