name: CSQTT Core native ARM64 real route-card toggle and SOCKS5 priority
on:
  push:
    branches:
      - test/csqtt-core-linux-unified-253-20261122
    paths:
      - adapt/singbox_route_toggle_linux_test.go
      - adapt/singbox_config_linux.go
      - adapt/singbox_manager_linux.go
      - adapt/csqtt_core_socks5_linux.go
      - .github/workflows/csqtt-core-route-toggle-real-arm64.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  native-route-toggle:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45038262207
          name: csqtt-core-linux-arm64-unified-253-four-component-EXPERIMENTAL
          github-token: ${{ github.token }}
          path: verified-bundle
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
      - name: Verify native ARM64 and unchanged pinned Sing-box component
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          python3 -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('verified-bundle')
          m=json.loads((root/'manifest.json').read_text())
          assert m['status']=='experimental-not-approved-for-production'
          assert m['globalDefaultRoute'] is False
          assert len(m['files'])==4
          for name,meta in m['files'].items():
              path=root/'bin'/name
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==meta['sha256']
          print('PINNED_FOUR_COMPONENT_PROVENANCE_PASS')
          PY
          chmod 0755 verified-bundle/bin/csqtt-core-sing-box-arm64
          verified-bundle/bin/csqtt-core-sing-box-arm64 version | grep -Fx 'sing-box version 1.14.4'
      - name: Actual SOCKS5 TCP routing across six on-off and priority phases
        shell: bash
        env:
          CSQTT_SING_BOX_BINARY: ${{ github.workspace }}/verified-bundle/bin/csqtt-core-sing-box-arm64
        run: |
          set -euo pipefail
          before4="$(ip -4 route show default)"
          before6="$(ip -6 route show default)"
          cat > adapt/zz_route_toggle_fixture_linux_test.go <<'GO'
          //go:build linux
          package main
          import ("strings";"testing";"time";"syscall")
          func shellQuoteForTest(value string) string {
            return "'" + strings.ReplaceAll(value, "'", "'\\''") + "'"
          }
          func waitProcessGone(t *testing.T,pid int) {
            t.Helper()
            deadline:=time.Now().Add(3*time.Second)
            for time.Now().Before(deadline) {
              err:=syscall.Kill(pid,0)
              if err==syscall.ESRCH || (err!=nil && err!=syscall.EPERM) {return}
              time.Sleep(20*time.Millisecond)
            }
            t.Fatalf("process %d still alive",pid)
          }
          GO
          trap 'rm -f adapt/zz_route_toggle_fixture_linux_test.go' EXIT
          cd adapt
          GO111MODULE=off GOTOOLCHAIN=local go test -race -count=1 -timeout=160s -run '^TestSingBoxSystemCardToggleActualTraffic$' -v             singbox_config_linux.go singbox_manager_linux.go singbox_transaction_linux.go             csqtt_core_socks5_linux.go singbox_config_linux_test.go singbox_route_toggle_linux_test.go singbox_manager_linux_test.go csqtt_core_socks5_linux_test.go singbox_manager_rollback_linux_test.go singbox_transaction_linux_test.go zz_route_toggle_fixture_linux_test.go             | tee "$RUNNER_TEMP/route-toggle.log"
          grep -q '^--- PASS: TestSingBoxSystemCardToggleActualTraffic' "$RUNNER_TEMP/route-toggle.log"
          test "$(ip -4 route show default)" = "$before4"
          test "$(ip -6 route show default)" = "$before6"
          echo CSQTT_ROUTE_TOGGLE_NATIVE_ARM64_REAL_TCP_RACE_PASS
# Test uses loopback-only ephemeral SOCKS5 fixtures and never changes
# host routes, firewall, systemd, production credentials or NanoPi services.
