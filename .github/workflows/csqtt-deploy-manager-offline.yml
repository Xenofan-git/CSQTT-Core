name: CSQTT DeployManager offline acceptance
on:
  push:
    branches:
      - 'test/csqtt-deploy-*'
      - 'fix/csqtt-deploy-*'
    paths:
      - 'adapt/deploy-manager-core/**'
      - adapt/test-csqtt-deploy-manager-offline.sh
      - .github/workflows/csqtt-deploy-manager-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-manager:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Local contracts, synthetic transport, race and ARM64 compilation
        run: bash adapt/test-csqtt-deploy-manager-offline.sh
# No server credentials, SSH connections, installer execution or artifact publication.
