name: CSQTT Linux runtime adapter tests

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/csqtt-2.5.0-core
    paths:
      - linux-runtime/**
      - .github/workflows/csqtt-linux-runtime-tests.yml

permissions:
  contents: write

jobs:
  linux-arm64:
    name: Test independent CSQTT Linux runtime primitives on ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache-dependency-path: linux-runtime/go.mod

      - name: Format Go sources
        run: |
          set -euxo pipefail
          gofmt -w linux-runtime/socks5/*.go
          test -z "$(gofmt -l linux-runtime)"

      - name: Run race-enabled unit tests
        working-directory: linux-runtime
        run: |
          set -euxo pipefail
          go test -race -count=1 -v ./...

      - name: Run static analysis
        working-directory: linux-runtime
        run: |
          set -euxo pipefail
          go vet ./...

      - name: Commit gofmt changes after successful tests
        run: |
          set -euxo pipefail
          if ! git diff --quiet -- linux-runtime/socks5; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add linux-runtime/socks5/*.go
            git commit -m "style: format independent CSQTT SOCKS adapter"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
