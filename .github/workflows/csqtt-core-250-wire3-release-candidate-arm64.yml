name: CSQTT Core 2.5 WIRE-3 release-candidate Go TUN ARM64 regression
on:
  push:
    branches: [release/csqtt-250-wire3-candidate-20261121]
    paths:
      - adapt/csqtt_core_250_client_launch_linux.go
      - adapt/csqtt_core_250_client_launch_linux_test.go
      - adapt/csqtt_core_250_client_launch_real_elf_linux_test.go
      - adapt/csqtt_core_250_supervisor_gate_linux.go
      - adapt/csqtt_core_250_supervisor_gate_linux_test.go
      - adapt/csqtt_core_250_supervisor_lifecycle_linux_test.go
      - adapt/apply-csqtt-core-250-supervisor-gate.py
      - adapt/apply-csqtt-core-linux-tun-rawfd.py
      - adapt/assemble-csqtt-core-250-candidate.py
      - adapt/headless_main.go
      - adapt/csqtt_core_250_auth_api_linux_test.go
      - .github/workflows/csqtt-core-250-wire3-release-candidate-arm64.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  gated-supervisor-actual-client:
    name: Original 2.5 ARM64 ELF with existing Go LinuxRunner (opt-in only)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Use unchanged original CSQTT 2.5 native ARM64 client
        uses: actions/download-artifact@v4
        with:
          run-id: 44833128457
          name: csqtt-250-original-arm64-client-and-server
          github-token: ${{ github.token }}
          path: original-250
      - name: Verify original ELF and its pinned provenance
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/original-250/original-csqtt-250/rust-client/target/release/client"
          chmod 0755 "$binary"
          echo "3c76a4323ef784568a38a82e206cecfa7657d93c01b6a69033a2f7a2f44760fa  $binary" | sha256sum -c -
          file "$binary" | grep -F 'ARM aarch64'
          grep -Fx 'source_sha=fd936ef087c34cc46f26111dc2361f43b8b03c07' original-250/CSQTT-250-ARM64-BUILD.txt
          echo "CSQTT_250_ORIGINAL_CLIENT_BINARY=$binary" >> "$GITHUB_ENV"
          echo ORIGINAL_250_CLIENT_ELF_VERIFIED
      - name: Reconstruct existing Go LinuxRunner and apply ONLY candidate launcher
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/Endlad2/LaLune.git upstream-lalune
          git -C upstream-lalune checkout -q --detach e4a6d08b63aef6025bf8ad8f77da660ea552e04b
          test "$(git -C upstream-lalune rev-parse HEAD)" = e4a6d08b63aef6025bf8ad8f77da660ea552e04b
          python3 adapt/apply-pinned-original-linux-arm64-policy.py
          python3 adapt/apply-csqtt-core-linux-tun-rawfd.py
          python3 adapt/apply-csqtt-core-socks5.py
          python3 adapt/apply-csqtt-core-250-supervisor-gate.py
          python3 adapt/patch-csqtt-deploy-ui.py
          cp adapt/csqtt_core_socks5_linux.go adapt/csqtt_core_socks5_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/csqtt_core_250_client_launch_linux.go adapt/csqtt_core_250_client_launch_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/csqtt_core_250_client_launch_real_elf_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/csqtt_core_250_supervisor_gate_linux.go adapt/csqtt_core_250_supervisor_gate_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/csqtt_core_250_supervisor_lifecycle_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/linux_runner_lifecycle_test.go adapt/linux_tun_vm_test.go adapt/linux_core_argv_test.go upstream-lalune/Desktop/Linux/
          cp adapt/singbox_config_linux.go adapt/singbox_config_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/singbox_manager_linux.go adapt/singbox_manager_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/singbox_transaction_linux.go adapt/singbox_transaction_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/singbox_manager_rollback_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/headless_main.go adapt/headless_main_test.go adapt/headless_api_contract_test.go upstream-lalune/Desktop/Linux/
          cp adapt/csqtt_core_250_auth_api_linux_test.go upstream-lalune/Desktop/Linux/
          cp adapt/vktoken_input_test.go upstream-lalune/Desktop/Libs/
          cp upstream-lalune/Desktop/Windows/go.mod upstream-lalune/Desktop/Linux/go.mod
          cp upstream-lalune/Desktop/Windows/go.sum upstream-lalune/Desktop/Linux/go.sum
          cp upstream-lalune/Core/SmartTunnel.lua upstream-lalune/Desktop/Libs/SmartTunnel.lua
          ln -s ../Libs upstream-lalune/Desktop/Linux/Libs
          mv upstream-lalune/Desktop/Linux/app.go upstream-lalune/Desktop/Linux/app_gui.go.disabled
          mkdir -p upstream-lalune/Desktop/Linux/frontend
          cp adapt/csqtt-panel-preview.html upstream-lalune/Desktop/Linux/frontend/index.html
          cp adapt/nanopi.js upstream-lalune/Desktop/Linux/frontend/api.js
          grep -Fq 'unix.Read(tunFD, buf)' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'unix.Write(tunFD, buf[:n])' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'csqtt250VerifiedBinaryPath()' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'cmd = candidate' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'cmdArgs = appendCSQTTAuthArgs(cmdArgs, password, deviceID)' upstream-lalune/Desktop/Linux/app_linux.go
          grep -Fq 'чувствительные параметры скрыты' upstream-lalune/Desktop/Libs/bridge.go
          grep -Fq '"core": csqttCoreSelectedVersionLabel()' upstream-lalune/Desktop/Linux/headless_main.go
          echo EXISTING_GORUNNER_250_EXPERIMENTAL_SOURCE_GENERATION_PASS
      - name: Test Go supervisor's real client startup and regression guards
        working-directory: upstream-lalune/Desktop/Linux
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout 180s -run '^TestCSQTT250|^TestLinuxRunner|^TestLinuxTun|^TestBridgeStartTunnel' -v .
          go test -race -count=1 -timeout 210s -run '^TestCSQTT250|^TestLinuxTunStopJoinsWorkersAndIsIdempotent|^TestBridgeStartTunnelReconnectLifecycle' .
          echo ORIGINAL_250_REAL_GO_SUPERVISOR_TUN_LIFECYCLE_AND_RACE_PASS
      - name: Build non-production ARM64 candidate Go controller
        working-directory: upstream-lalune/Desktop/Linux
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/csqtt-go-supervisor-250-arm64-candidate" .
          file "$RUNNER_TEMP/csqtt-go-supervisor-250-arm64-candidate" | grep -F 'ARM aarch64'
          echo ISOLATED_250_GO_SUPERVISOR_RAW_TUN_ARM64_CANDIDATE_BUILD_PASS
      - name: Download separately verified corrected Core 2.5.0 WIRE-3 ARM64 server
        uses: actions/download-artifact@v4
        with:
          run-id: 44890803542
          name: csqtt-core-verified-linux-arm64-91b154011ca16c219f57eef99462d3408dccfeeb
          github-token: ${{ github.token }}
          path: core8
      - name: Verify Core8 server and pinned sing-box for candidate
        shell: bash
        run: |
          set -euo pipefail
          chmod 0755 core8/csqtt-core-linux-arm64
          (cd core8 && sha256sum -c SHA256SUMS)
          echo "a131751f29a5373d3ebf08bc0d3bfe59988a8badaf2854f01eb5561fc903a706  core8/csqtt-core-linux-arm64" | sha256sum -c -
          grep -Fx 'repo_commit=91b154011ca16c219f57eef99462d3408dccfeeb' core8/BUILD-INFO.txt
          test "$(core8/csqtt-core-linux-arm64 --protocol-revision)" = "CSQTT-WIRE-3"
          curl -fL --retry 2 --retry-delay 1 --connect-timeout 10 --max-time 75 \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-arm64.tar.gz \
            -o "$RUNNER_TEMP/sing-box-1.14.4-arm64.tar.gz"
          echo "436441f76ee2f7fe21b5b2d426d3cb261a480455a704865789ad533e4273ec26  $RUNNER_TEMP/sing-box-1.14.4-arm64.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sing-box-pinned"
          tar -xzf "$RUNNER_TEMP/sing-box-1.14.4-arm64.tar.gz" -C "$RUNNER_TEMP/sing-box-pinned"
          singbox="$(find "$RUNNER_TEMP/sing-box-pinned" -type f -name sing-box -print -quit)"
          test -n "$singbox"
          chmod 0755 "$singbox"
          "$singbox" version | grep -Fx 'sing-box version 1.14.4'
          echo "CSQTT_250_PINNED_SINGBOX=$singbox" >> "$GITHUB_ENV"
          echo PINNED_CORE8_AND_SINGBOX_ARM64_VERIFIED
      - name: Assemble exact candidate bundle with no legacy server
        shell: bash
        env:
          CSQTT_CANDIDATE_ASSEMBLY: isolated-github-runner
        run: |
          set -euo pipefail
          python3 adapt/assemble-csqtt-core-250-candidate.py \
            --go "$RUNNER_TEMP/csqtt-go-supervisor-250-arm64-candidate" \
            --client "$CSQTT_250_ORIGINAL_CLIENT_BINARY" \
            --server "$GITHUB_WORKSPACE/core8/csqtt-core-linux-arm64" \
            --sing-box "$CSQTT_250_PINNED_SINGBOX" \
            --output "$GITHUB_WORKSPACE/candidate-bundle"
          python3 - <<'VERIFY'
          from pathlib import Path
          import json
          base=Path('candidate-bundle')
          m=json.loads((base/'manifest.json').read_text())
          assert m['wireProtocol']=='CSQTT-WIRE-3'
          assert m['status']=='experimental-not-approved-for-production'
          assert len(m['files'])==4
          assert all('wire4' not in n.lower() and '2.1.9' not in n for n in m['files'])
          assert not any(p.name.endswith(('.env','.key','.pem')) for p in base.rglob('*'))
          print('CSQTT_250_BUNDLE_MANIFEST_AND_NO_WIRE4_SERVER_PASS')
          VERIFY
      - name: Publish disposable test candidate for further ARM64 VM checks
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-core-250-raw-tun-go-original-client-core8-singbox-arm64
          path: candidate-bundle/
          retention-days: 7
          if-no-files-found: error
