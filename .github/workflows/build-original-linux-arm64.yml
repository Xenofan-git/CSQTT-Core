      - name: Set up .NET for ARM64 VK token fetcher
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch official CSQTT 2.1.9 server assets
        run: |
          set -euxo pipefail
          mkdir -p server-assets
          apk=/tmp/csqtt-v2.1.9-arm64.apk
          apk_url="https://github.com/amurcanov/csqtt/releases/download/v2.1.9/CSQTT-arm64-v8a.apk"
          apk_sha256=e0dde838d9df49be2ecab38adaecf808231ab5d65ddb6b4024a24fc2db879e04
          if ! curl -fL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 -o "$apk" "$apk_url"; then
            echo "GitHub browser download failed; resolving the exact v2.1.9 APK asset through the official GitHub API."
            rm -f "$apk"
            release_json=/tmp/csqtt-v2.1.9-release.json
            curl -fL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$release_json" \
              "https://api.github.com/repos/amurcanov/csqtt/releases/tags/v2.1.9"
            asset_id="$(python3 - "$release_json" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          if release.get("tag_name") != "v2.1.9":
              raise SystemExit("refusing unexpected CSQTT release tag")
          matches = [asset for asset in release.get("assets", []) if asset.get("name") == "CSQTT-arm64-v8a.apk"]
          if len(matches) != 1 or matches[0].get("digest") != "sha256:e0dde838d9df49be2ecab38adaecf808231ab5d65ddb6b4024a24fc2db879e04":
              raise SystemExit("official CSQTT APK asset metadata/digest mismatch")
          print(matches[0]["id"])
          PY
          )"
            test -n "$asset_id"
            curl -fL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 180 \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$apk" \
              "https://api.github.com/repos/amurcanov/csqtt/releases/assets/$asset_id"
          fi
          echo "$apk_sha256  $apk" | sha256sum -c -
          unzip -p "$apk" assets/csqtt-linux-arm64 > server-assets/csqtt-linux-arm64
          unzip -p /tmp/csqtt-v2.1.9-arm64.apk assets/csqtt-linux-amd64 > server-assets/csqtt-linux-amd64
          unzip -p /tmp/csqtt-v2.1.9-arm64.apk assets/csqtt-linux-armv7 > server-assets/csqtt-linux-armv7
          unzip -p /tmp/csqtt-v2.1.9-arm64.apk assets/csqtt.server-provenance.json > server-assets/csqtt.server-provenance.json
          curl -fL --retry 3 https://raw.githubusercontent.com/amurcanov/csqtt/v2.1.9/app/src/main/assets/deploy.sh -o server-assets/deploy.sh
          python3 adapt/patch-csqtt-deploy-script.py
          chmod 0755 server-assets/csqtt-linux-arm64 server-assets/csqtt-linux-amd64 server-assets/csqtt-linux-armv7 server-assets/deploy.sh server-assets/deploy-csqtt-lalune.sh
          bash -n server-assets/deploy-csqtt-lalune.sh
          python3 adapt/test-csqtt-lalune-deploy-script.py
          # The standalone installer remains regression-tested but is not used by Deploy.
          chmod 0755 server-assets/install-csqtt-lalune.sh server-assets/uninstall-csqtt-lalune.sh
          bash -n server-assets/install-csqtt-lalune.sh
          bash -n server-assets/uninstall-csqtt-lalune.sh
          grep -Fq 'readonly SCRIPT_VERSION="2.1.9"' server-assets/deploy-csqtt-lalune.sh
          grep -Fq 'csqtt-lalune.service' server-assets/deploy-csqtt-lalune.sh
          grep -Fq 'CSQTT_LALUNE_DEPLOY_STAGE' server-assets/deploy-csqtt-lalune.sh || grep -Fq 'CSQTT_DEPLOY_STAGE' server-assets/deploy-csqtt-lalune.sh
          grep -Fq 'CSQTT_LALUNE_MANAGED' server-assets/deploy-csqtt-lalune.sh
          ! grep -Eq 'ip route flush cache|ip route flush table (main|default)|ip route replace default' server-assets/deploy-csqtt-lalune.sh
          grep -Fq 'rm -rf -- "$ETC" "$STATE" "$LOG"' server-assets/uninstall-csqtt-lalune.sh
          sha256sum server-assets/* | tee server-assets/SHA256SUMS
          grep -Fq '"version":  "2.1.9"' server-assets/csqtt.server-provenance.json
          grep -Fq '"assetName":  "csqtt-linux-arm64"' server-assets/csqtt.server-provenance.json
          grep -Fq '"assetName":  "csqtt-linux-amd64"' server-assets/csqtt.server-provenance.json
          grep -Fq '"assetName":  "csqtt-linux-armv7"' server-assets/csqtt.server-provenance.json
          grep -Fq 'readonly SCRIPT_VERSION="2.1.9"' server-assets/deploy.sh
      - name: Verify pinned upstream CSQTT ARM64 release baseline
        run: |
          set -euxo pipefail
          mkdir -p client-assets
          CLIENT_VERSION=2026.09.16.17.59
          test "$(curl -fsSL https://raw.githubusercontent.com/Endlad2/csqtt-core/main/LATEST)" = "$CLIENT_VERSION"
          curl -fL --retry 3 "https://github.com/Endlad2/csqtt-core/releases/download/$CLIENT_VERSION/client-linux-arm64" -o client-assets/client-linux-arm64-upstream
          printf '%s  %s\n' '9a5b917665fda6ee7b3cf8439e3194d46c763f2305d188b4962caee69048ae31' 'client-assets/client-linux-arm64-upstream' | sha256sum -c -
          file client-assets/client-linux-arm64-upstream
          readelf -h client-assets/client-linux-arm64-upstream | grep -Fq 'AArch64'
          echo PINNED_UPSTREAM_RUNTIME_CSQTT_CLIENT_BASELINE_PASS
      - name: Build production-patched CSQTT client and server with negotiated recovery
        run: |
          set -euxo pipefail
          mkdir -p client-assets
          git clone https://github.com/Endlad2/csqtt-core.git client-source
          git -C client-source checkout --detach 3eafb7ee868f5f2690edf3b0326153813f88eb5f
          test "$(git -C client-source rev-parse HEAD)" = "3eafb7ee868f5f2690edf3b0326153813f88eb5f"
          git clone --depth 1 --branch v2.1.9 https://github.com/amurcanov/csqtt.git server-source
          test "$(git -C server-source describe --tags --exact-match)" = "v2.1.9"
          cmp client-source/shared/wire_protocol.rs server-source/shared/wire_protocol.rs
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-unknown-linux-gnu --toolchain 1.97.1
          python3 scripts/ci/patch-csqtt-rjs-manual-fallback.py
          grep -F 'RJS: ошибка, fallback на ручную CAPTCHA' client-source/rust-client/captcha.rs
          grep -F 'self.webview(stream_id, captcha, "manual", Duration::from_secs(60))' client-source/rust-client/captcha.rs
          # Run the isolation audit against pristine upstream v2.1.9 before adaptation.
          python3 adapt/audit-csqtt-isolation.py
          python3 adapt/patch-csqtt-lalune-source.py
          # This is now part of the release build, not only an experimental fixture.
          # The same negotiated WIRE-4 liveness implementation is applied to the
          # pinned production client and its matching isolated server source.
          python3 scripts/ci/patch-csqtt-negotiated-liveness.py
          grep -Fq 'CSQTT_LIVENESS_V1' client-source/rust-client/session.rs
          grep -Fq 'CSQTT_LIVENESS_V1' server-source/rust-server/protocol.rs
          grep -Fq 'CSQTT-WIRE-4' client-source/shared/wire_protocol.rs
          grep -Fq 'CSQTT-WIRE-4' server-source/shared/wire_protocol.rs
          CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo +1.97.1 build --locked --release --target aarch64-unknown-linux-gnu --manifest-path client-source/rust-client/Cargo.toml --bin client
          install -m 0755 client-source/rust-client/target/aarch64-unknown-linux-gnu/release/client client-assets/client-linux-arm64
          printf '%s\n' 'source=Endlad2/csqtt-core@3eafb7ee868f5f2690edf3b0326153813f88eb5f' 'patch=rjs-manual-captcha-fallback-v1' 'recovery=negotiated-wire-4-liveness-v1' > client-assets/VERSION
          file client-assets/client-linux-arm64
          readelf -h client-assets/client-linux-arm64 | grep -Fq 'AArch64'
          strings -a client-assets/client-linux-arm64 | grep -Fq 'fallback'
          strings -a client-assets/client-linux-arm64 | grep -Fq 'CSQTT_LIVENESS_V1'
          # The production artifact must never contain CI-only TURN credentials
          # or TUNCONF counters; those are injected only after this binary is copied.
          ! strings -a client-assets/client-linux-arm64 | grep -Fq 'CSQTT_TEST_TURN_USERNAME'
          ! strings -a client-assets/client-linux-arm64 | grep -Fq 'CSQTT_TEST_TUNCONF_COUNTER_FILE'
          sha256sum client-assets/client-linux-arm64 | tee client-assets/SHA256SUMS
          echo PRODUCTION_WIRE4_LIVENESS_ARM64_CLIENT_BUILD_PASS
      - name: Build CI-only ARM64 client with isolated TURN test adapter
        run: |
          set -euxo pipefail
          # The production client was already built and copied before this test-only
          # instrumentation is applied. This second binary uses the same pinned,
          # NanoPi-adapted WIRE-4 source but injects disposable TURN credentials and
          # counters so the real ARM64 process can be tested without VK secrets.
          python3 scripts/ci/patch-csqtt-process-e2e-auth.py
          grep -Fq 'CSQTT_TEST_TUNCONF_PARSED' client-source/rust-client/session.rs
          grep -Fq 'CSQTT_TEST_TURN_USERNAME' client-source/rust-client/auth.rs
          CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo +1.97.1 build --locked --release --target aarch64-unknown-linux-gnu --manifest-path client-source/rust-client/Cargo.toml --bin client
          install -m 0755 client-source/rust-client/target/aarch64-unknown-linux-gnu/release/client /tmp/csqtt-client-arm64-e2e
          file /tmp/csqtt-client-arm64-e2e
          readelf -h /tmp/csqtt-client-arm64-e2e | grep -Fq 'AArch64'
          strings -a /tmp/csqtt-client-arm64-e2e | grep -Fq 'CSQTT_LIVENESS_V1'
          strings -a /tmp/csqtt-client-arm64-e2e | grep -Fq 'CSQTT_TEST_TUNCONF_PARSED'
